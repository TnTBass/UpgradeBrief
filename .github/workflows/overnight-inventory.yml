name: Validate overnight recovery
on:
  push:
    branches: [codex/overnight-inventory-20261031]
    paths:
      - scripts/lib/**
      - .github/workflows/overnight-inventory.yml
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/test-vspc-kb-cve-coverage.mjs
      - run: node scripts/refresh-catalog.mjs --live
      - name: Require a complete refresh and atomic equivalence
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs';const r=JSON.parse(readFileSync('artifacts/catalog-review/refresh-result.json'));if(r.status!=='complete'||!r.shadowCompared)throw Error('Incomplete refresh');console.log(JSON.stringify(r));"
      - run: node scripts/verify-catalog-repair.mjs
      - name: Save verified catalog candidate
        run: |
          git add src/data/catalog.snapshot.json scripts/data/security-review-baselines.json
          git config user.name 'upgrade-brief[bot]'
          git config user.email 'upgrade-brief[bot]@users.noreply.github.com'
          git commit -m 'Refresh all products after inventory and fingerprint recovery'
          git push origin HEAD:codex/overnight-catalog-candidate-20261031
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: overnight-live-validation
          path: |
            artifacts/catalog-review/
            artifacts/catalog-repair/verification/
          retention-days: 7
  dependency-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Install compatible lint tooling and patched glob matcher
        run: |
          npm pkg set 'overrides.minimatch=11.0.3'
          npm install --ignore-scripts --save-dev --save-exact eslint@10.14.0 @eslint/js@10.0.1 typescript-eslint@8.72.1 eslint-plugin-react-hooks@7.1.1 eslint-plugin-react-refresh@0.5.7
          npm audit --audit-level=moderate
      - run: npm run lint
      - run: node scripts/verify-catalog-repair.mjs
      - name: Save passing dependency trial to a separate branch
        run: |
          git add package.json package-lock.json
          git config user.name 'upgrade-brief[bot]'
          git config user.email 'upgrade-brief[bot]@users.noreply.github.com'
          git commit -m 'Update lint tooling to use patched minimatch'
          git push origin HEAD:codex/overnight-dependency-candidate-20261031
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: dependency-trial-logs
          path: artifacts/catalog-repair/verification/
          retention-days: 7
