name: Refresh catalog

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-control
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:adapters
      - run: npm run test:vbr-upgrade-path-adapter
      - run: npm run test:product-build-adapter
      - run: npm run test:enterprise-manager-build-adapter
      - run: npm run test:security-adapter
      - run: npm run test:release-security-adapter
      - run: npm run test:veeam-one-legacy-security-adapter
      - run: npm run test:vspc-legacy-security-adapter
      - run: npm run test:vspc-kb-cve-coverage
      - run: npm run test:vspc-cve-record-coverage
      - run: npm run test:vspc-release-security
      - run: npm run test:security-feed-coverage
      - run: npm run test:reviewed-security-advisories
      - run: npm run test:security-review-baselines
      - run: npm run test:catalog-repair
      - run: npm run test:catalog-recovery
      - run: npm run test:release-material-discovery
      - run: npm run test:release-information-adapter
      - run: npm run test:release-material-adapter
      - run: npm run test:lifecycle-adapter
      - run: npm run test:kev-adapter
      - run: npm run test:source-fetch
      - name: Refresh catalog and enforce security KB coverage
        id: catalog-refresh
        run: npm run refresh:catalog -- --live
      - name: Verify the refreshed catalog and application before publishing
        run: node scripts/verify-catalog-repair.mjs
      - name: Upload failed catalog verification logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: catalog-refresh-verification
          path: artifacts/catalog-repair/verification/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit a validated catalog refresh when data changed
        run: |
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)" || { echo 'Main changed; discard this refresh and rerun against main.'; exit 1; }
          git add src/data/catalog.snapshot.json scripts/data/security-review-baselines.json
          git diff --cached --quiet && exit 0
          git config user.name 'upgrade-brief[bot]'
          git config user.email 'upgrade-brief[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh Veeam source catalog'
          git push origin HEAD:main
      - name: Verify the published snapshot after the refresh commit
        run: node scripts/verify-published-catalog.mjs
      - name: Keep retained product failures open after publication
        run: node scripts/report-partial-refresh.mjs
      - name: Upload catalogue source review
        if: always() && steps.catalog-refresh.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: catalogue-source-review
          path: artifacts/catalog-review/
          if-no-files-found: warn
          retention-days: 7
