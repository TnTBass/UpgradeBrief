name: Review VBR journey sources
on:
  push:
    branches: [codex/oct30-followups]
    paths:
      - .github/workflows/review-journey-sources.yml
      - scripts/review-journey-sources.mjs
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/review-journey-sources.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vbr-journey-source-review
          path: artifacts/journey-review
          retention-days: 14
