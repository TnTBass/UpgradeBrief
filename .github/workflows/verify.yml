name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run test:adapters
      - run: npm run test:vbr-upgrade-path-adapter
      - run: npm run test:enterprise-manager-build-adapter
      - run: npm run test:security-adapter
      - run: npm run test:release-security-adapter
      - run: npm run test:veeam-one-legacy-security-adapter
      - run: npm run test:vspc-legacy-security-adapter
      - run: npm run test:vspc-kb-cve-coverage
      - run: npm run test:vspc-cve-record-coverage
      - run: npm run test:vspc-release-security
      - run: npm run test:security-feed-coverage
      - run: npm run test:reviewed-security-advisories
      - run: npm run test:release-information-adapter
      - run: npm run test:lifecycle-adapter
      - run: npm run test:kev-adapter
      - run: npm run test:source-fetch
      - run: npm run validate:catalog
      - run: npm run build
