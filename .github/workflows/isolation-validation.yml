name: Validate product refresh isolation
on:
  push:
    branches: [codex/product-refresh-isolation]
    paths: [.github/workflows/isolation-validation.yml]
permissions:
  contents: write
jobs:
  live-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/validate-isolation-live.mjs
      - run: node scripts/verify-catalog-repair.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: product-isolation-validation
          path: |
            artifacts/catalog-isolation/
            artifacts/catalog-repair/verification/
          retention-days: 7
      - name: Commit only the fully validated schema migration
        run: |
          git add src/data/catalog.snapshot.json scripts/data/security-review-baselines.json
          git diff --cached --quiet && exit 0
          git config user.name 'upgrade-brief[bot]'
          git config user.email 'upgrade-brief[bot]@users.noreply.github.com'
          git commit -m 'chore: migrate fully validated catalog to product provenance'
          git push origin HEAD:codex/product-refresh-isolation

# Validation revision 4: persist reviewed ownership including supplemental VRO evidence.
