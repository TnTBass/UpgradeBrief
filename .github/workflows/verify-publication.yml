name: Verify published catalog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-publication-verification
  cancel-in-progress: true

jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Verify the deployed commit and catalog hash
        run: node scripts/verify-published-catalog.mjs
