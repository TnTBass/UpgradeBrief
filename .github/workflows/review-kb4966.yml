name: Review KB4966 source
on:
  push:
    branches: ['repair/kb4966-review-20261111']
    paths: ['.github/workflows/review-kb4966.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Capture current advisory and production health
        run: |
          node --input-type=module <<'NODE'
          import { normalizeReviewedSecurityMainArticle, fingerprintReviewedSecurityMainArticle } from './scripts/lib/reviewed-security-advisories.mjs'
          const response = await fetch('https://www.veeam.com/kb4966', {signal: AbortSignal.timeout(120000)})
          if (!response.ok) throw new Error('Advisory HTTP ' + response.status)
          const html = await response.text()
          console.log('REVIEW_SOURCE=' + JSON.stringify({url: response.url, fingerprint: fingerprintReviewedSecurityMainArticle(html), text: normalizeReviewedSecurityMainArticle(html)}))
          const health = await fetch('https://upgradebrief.com/catalog-health.json?review=20261111', {signal: AbortSignal.timeout(60000)})
          console.log('PRODUCTION_HEALTH=' + JSON.stringify({status: health.status, body: await health.text()}))
          NODE
