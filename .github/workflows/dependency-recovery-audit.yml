name: Dependency recovery audit
on:
  push:
    branches: [codex/dependency-recovery-20261030]
    paths:
      - .github/workflows/dependency-recovery-audit.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Capture initial audit evidence
        run: |
          mkdir -p artifacts/dependency-audit
          npm audit --json > artifacts/dependency-audit/before.json || audit_status=$?
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const r=JSON.parse(readFileSync('artifacts/dependency-audit/before.json')); if(r.error||!r.metadata) throw Error('Audit unavailable'); console.log(JSON.stringify(r.metadata));"
      - name: Apply targeted compatible dependency updates
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact vite@8.3.5
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact vitest@4.1.12
          npm update --package-lock-only --ignore-scripts dompurify baseline-browser-mapping brace-expansion browserslist js-yaml nanoid postcss source-map-js zod
          git diff --stat -- package.json package-lock.json
      - name: Clean install and verify advisory removal
        run: |
          npm ci --ignore-scripts
          npm audit --json > artifacts/dependency-audit/after.json
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const r=JSON.parse(readFileSync('artifacts/dependency-audit/after.json')); if(r.error||r.metadata?.vulnerabilities?.total!==0) throw Error('Advisories remain'); console.log(JSON.stringify(r.metadata));"
      - name: Verify application and catalog
        run: node scripts/verify-catalog-repair.mjs
      - name: Install isolated browser verification tooling
        run: |
          browser_version=$(npm view playwright version)
          echo "Browser verification uses Playwright $browser_version"
          npm install --prefix "$RUNNER_TEMP/dependency-browser-smoke" --ignore-scripts --no-save "playwright@$browser_version"
          node "$RUNNER_TEMP/dependency-browser-smoke/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify browser PDF downloads
        env:
          BROWSER_TEST_ROOT: ${{ runner.temp }}/dependency-browser-smoke
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createRequire} from 'node:module';
          import {spawn} from 'node:child_process';
          import {readFile} from 'node:fs/promises';
          import {join} from 'node:path';
          import {getDocument} from 'pdfjs-dist/legacy/build/pdf.mjs';
          const require = createRequire(join(process.env.BROWSER_TEST_ROOT,'package.json'));
          const {chromium} = require('playwright');
          const server = spawn(process.execPath,['node_modules/vite/bin/vite.js','preview','--host','127.0.0.1','--port','4173','--strictPort'], {stdio:'inherit'});
          let browser;
          try {
            let ready = false;
            for(let i=0;i<50;i++) { try { const r=await fetch('http://127.0.0.1:4173'); if(r.ok){ready=true;break;} } catch {} await new Promise(r=>setTimeout(r,200)); }
            assert.ok(ready,'Preview server started');
            browser=await chromium.launch();
            const page=await browser.newPage();
            await page.route('**/*',route=>new URL(route.request().url()).hostname==='127.0.0.1'?route.continue():route.abort());
            const errors=[]; page.on('pageerror',error=>errors.push(error.message));
            for(const version of ['13.0.1.180','11a','13.1.2.57']) {
              await page.goto('http://127.0.0.1:4173/?product=vbr&version='+encodeURIComponent(version));
              const downloadPromise=page.waitForEvent('download');
              await page.getByRole('button',{name:'Download executive summary (PDF)'}).click();
              const download=await downloadPromise;
              assert.equal(await download.failure(),null);
              const path='artifacts/dependency-audit/'+version.replaceAll('.','-')+'.pdf';
              await download.saveAs(path);
              const bytes=new Uint8Array(await readFile(path));
              assert.ok(new TextDecoder().decode(bytes.slice(0,5))==='%PDF-');
              const doc=await getDocument({data:bytes,useWorkerFetch:false,isEvalSupported:false}).promise;
              let text='';
              for(let i=1;i<=doc.numPages;i++) text+=(await (await doc.getPage(i)).getTextContent()).items.map(x=>x.str??'').join(' ');
              assert.match(text,/DECISION SUMMARY/);
              assert.match(text,/Veeam Backup & Replication/);
              if(version==='13.1.2.57') assert.match(text,/current cataloged release/);
              console.log(JSON.stringify({version,pages:doc.numPages,filename:download.suggestedFilename(),bytes:bytes.length,status:'browser-pdf-verified'}));
              await doc.destroy();
            }
            assert.deepEqual(errors,[]);
          } finally { await browser?.close(); server.kill(); }
          NODE
      - name: Capture verified dependency candidate on recovery branch
        run: |
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git config user.name 'upgrade-brief[bot]'
          git config user.email 'upgrade-brief[bot]@users.noreply.github.com'
          git commit -m 'fix: update vulnerable build and PDF dependencies'
          git push origin HEAD:codex/dependency-recovery-20261030
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-audit
          path: |
            artifacts/dependency-audit/
            artifacts/catalog-repair/verification/
          retention-days: 7
