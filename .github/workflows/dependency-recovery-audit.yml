name: Dependency recovery audit
on:
  push:
    branches: [codex/dependency-recovery-20261030]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Capture audit evidence
        run: |
          mkdir -p artifacts/dependency-audit
          npm audit --json > artifacts/dependency-audit/before.json || audit_status=$?
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const report = JSON.parse(readFileSync('artifacts/dependency-audit/before.json','utf8'));
          if (report.error || !report.metadata) throw new Error('Dependency audit did not complete');
          console.log(JSON.stringify(report, null, 2));
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-audit
          path: artifacts/dependency-audit/
          retention-days: 7
